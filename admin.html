<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo Movies — Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:#121212;
    border:1px solid #292929;
    border-radius:16px;
    padding:30px;
}

.logo{
    text-align:center;
    color:#e50914;
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input,select,textarea{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    background:#080808;
    border:1px solid #333;
    border-radius:7px;
    color:white;
}

button{
    width:100%;
    padding:14px;
    background:#e50914;
    border:0;
    border-radius:7px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#ff5555;
}

#adminPanel{
    display:none;
}

header{
    background:#111;
    border-bottom:1px solid #292929;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    width:92%;
    max-width:1100px;
    margin:35px auto;
}

.panel{
    background:#121212;
    border:1px solid #292929;
    border-radius:14px;
    padding:25px;
    margin-bottom:25px;
}

.movie{
    background:#080808;
    border:1px solid #292929;
    border-radius:10px;
    padding:15px;
    margin-top:12px;
}

.logout{
    width:auto;
    padding:10px 16px;
    background:#333;
}

.delete{
    width:auto;
    padding:8px 14px;
    margin-top:10px;
    background:#b00020;
}
</style>
</head>

<body>

<!-- ADMIN LOGIN -->

<div id="loginPage" class="login">

    <div class="box">

        <div class="logo">🎬 GEO MOVIES</div>

        <h2>🔐 ადმინისტრატორი</h2>

        <input
            id="email"
            type="email"
            placeholder="Admin Email"
        >

        <input
            id="password"
            type="password"
            placeholder="პაროლი"
        >

        <button onclick="login()">
            შესვლა
        </button>

        <div id="message" class="message"></div>

    </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

<header>

    <div style="color:#e50914;font-size:24px;font-weight:bold;">
        🎬 GEO MOVIES ADMIN
    </div>

    <button class="logout" onclick="logout()">
        გასვლა
    </button>

</header>


<div class="container">

    <div class="panel">

        <h2 style="text-align:left;">
            ➕ ფილმის / სერიალის / მულტფილმის დამატება
        </h2>

        <input
            id="title"
            type="text"
            placeholder="სათაური"
        >

        <input
            id="poster"
            type="url"
            placeholder="პოსტერის URL"
        >

        <textarea
            id="description"
            placeholder="აღწერა"
        ></textarea>

        <select id="genre">

            <option value="ფილმი">🎬 ფილმი</option>
            <option value="სერიალი">📺 სერიალი</option>
            <option value="მულტფილმი">🧸 მულტფილმი</option>

        </select>

        <input
            id="video"
            type="url"
            placeholder="ვიდეოს URL"
        >

        <button onclick="addMovie()">
            🎬 დამატება
        </button>

        <div id="movieMessage" class="message"></div>

    </div>


    <div class="panel">

        <h2 style="text-align:left;">
            🎬 დამატებული ვიდეოები
        </h2>

        <div id="movies">
            იტვირთება...
        </div>

    </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://xikxyebvsfpkynhesabm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-CTMHKDnHnuorO8F6NCTgQ_yC27MtQW";

const ADMIN_EMAIL =
"manuchar.fartenadze@gmail.com";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =============================
// LOGIN
// =============================

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if(!email || !password){

        message.textContent =
            "შეიყვანე Email და პაროლი.";

        return;
    }


    if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){

        message.textContent =
            "❌ ეს მომხმარებელი Admin არ არის.";

        return;
    }


    message.style.color="#aaa";
    message.textContent="მიმდინარეობს შესვლა...";


    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });


    if(error){

        message.style.color="#ff5555";

        message.textContent =
            "❌ " + error.message;

        return;
    }


    if(!data.user){

        message.textContent =
            "მომხმარებელი ვერ მოიძებნა.";

        return;
    }


    if(
        data.user.email.toLowerCase()
        !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient.auth.signOut();

        message.textContent =
            "❌ წვდომა აკრძალულია.";

        return;
    }


    showAdmin();
}


// =============================
// SHOW ADMIN
// =============================

async function showAdmin(){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("adminPanel").style.display="block";

    loadMovies();
}


// =============================
// LOGOUT
// =============================

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();
}


// =============================
// ADD MOVIE
// =============================

async function addMovie(){

    const title =
        document.getElementById("title").value.trim();

    const poster =
        document.getElementById("poster").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const genre =
        document.getElementById("genre").value;

    const video =
        document.getElementById("video").value.trim();

    const message =
        document.getElementById("movieMessage");


    if(!title || !video){

        message.textContent =
            "სათაური და ვიდეოს URL აუცილებელია.";

        return;
    }


    const {error} =
        await supabaseClient
        .from("movies")
        .insert({

            title:title,

            description:description || null,

            poster_url:poster || null,

            video_url:video,

            genre:genre

        });


    if(error){

        message.textContent =
            "❌ შეცდომა: " + error.message;

        return;
    }


    message.style.color="#38d996";

    message.textContent =
        "✅ წარმატებით დაემატა!";


    document.getElementById("title").value="";
    document.getElementById("poster").value="";
    document.getElementById("description").value="";
    document.getElementById("video").value="";


    loadMovies();
}


// =============================
// LOAD MOVIES
// =============================

async function loadMovies(){

    const container =
        document.getElementById("movies");


    const {data,error} =
        await supabaseClient
        .from("movies")
        .select("*")
        .order("created_at",{ascending:false});


    if(error){

        container.innerHTML =
            "❌ " + error.message;

        return;
    }


    if(!data || data.length===0){

        container.innerHTML =
            "🎬 ჯერ ფილმი არ დამატებულა.";

        return;
    }


    container.innerHTML =
        data.map(movie => `

            <div class="movie">

                <strong>
                    ${escapeHtml(movie.title)}
                </strong>

                <div style="color:#888;margin-top:7px;">
                    ${escapeHtml(movie.genre || "")}
                </div>

                <button
                    class="delete"
                    onclick="deleteMovie('${movie.id}')"
                >
                    🗑 წაშლა
                </button>

            </div>

        `).join("");
}


// =============================
// DELETE
// =============================

async function deleteMovie(id){

    if(!confirm("ნამდვილად წავშალოთ?"))
        return;


    const {error} =
        await supabaseClient
        .from("movies")
        .delete()
        .eq("id",id);


    if(error){

        alert("წაშლა ვერ მოხერხდა: " + error.message);

        return;
    }


    loadMovies();
}


// =============================
// SECURITY
// =============================

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


// =============================
// CHECK EXISTING SESSION
// =============================

async function checkSession(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(
        data.session &&
        data.session.user.email &&
        data.session.user.email.toLowerCase()
        ===
        ADMIN_EMAIL.toLowerCase()
    ){

        showAdmin();

    }

}

checkSession();

</script>

</body>
    </html>
