<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geo Movies — ქართული ვიდეო პლატფორმა</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,8,8,.97);
    border-bottom:1px solid #292929;
    padding:15px 5%;
}

.header-inner{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    color:#e50914;
    font-size:28px;
    font-weight:900;
    white-space:nowrap;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#e50914;
}

.search{
    margin-left:auto;
    width:220px;
    padding:11px 14px;
    background:#181818;
    border:1px solid #333;
    border-radius:7px;
    color:white;
    outline:none;
}

.user-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.user-email{
    color:#aaa;
    font-size:13px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    background:#e50914;
    color:white;
}

.logout-btn{
    background:#333;
    color:white;
}

.admin-btn{
    background:#e50914;
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:7px;
    font-weight:bold;
}

.hero{
    min-height:520px;
    display:flex;
    align-items:center;
    padding:80px 7%;
    background:
        linear-gradient(90deg,#000 0%,rgba(0,0,0,.85) 40%,rgba(0,0,0,.2)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=85");
    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:650px;
}

.badge{
    color:#e50914;
    font-weight:bold;
    margin-bottom:15px;
}

.hero h1{
    font-size:55px;
    line-height:1.1;
    margin-bottom:20px;
}

.hero p{
    color:#ddd;
    font-size:18px;
    line-height:1.7;
}

.section{
    padding:40px 5%;
}

.section h2{
    font-size:30px;
    margin-bottom:25px;
}

.row{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:15px;
}

.movie{
    display:block;
    background:#151515;
    border-radius:9px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.25s;
}

.movie:hover{
    transform:scale(1.04);
}

.movie img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
    background:#111;
}

.movie-info{
    padding:13px;
}

.movie-info h3{
    font-size:16px;
    margin-bottom:8px;
}

.movie-info span{
    color:#999;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#777;
    padding:50px 20px;
    background:#111;
    border-radius:10px;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:50px;
}

.auth-box{
    display:none;
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.85);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:400px;
    background:#151515;
    border:1px solid #333;
    border-radius:15px;
    padding:25px;
}

.auth-card h2{
    margin-bottom:20px;
    text-align:center;
}

.auth-card input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    background:#080808;
    color:white;
    border:1px solid #333;
    border-radius:7px;
}

.auth-card button{
    width:100%;
    margin-top:5px;
}

.close-auth{
    background:#333;
    margin-top:10px;
}

.auth-message{
    text-align:center;
    color:#ff5555;
    margin-top:12px;
    min-height:20px;
}

footer{
    padding:40px 20px;
    text-align:center;
    color:#777;
    border-top:1px solid #222;
}

@media(max-width:1100px){
    .row{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:700px){

    header{
        padding:12px 15px;
    }

    .header-inner{
        gap:12px;
    }

    .logo{
        font-size:23px;
    }

    nav{
        width:100%;
        order:5;
        overflow-x:auto;
        padding-bottom:4px;
    }

    .search{
        width:150px;
    }

    .user-email{
        display:none;
    }

    .hero{
        min-height:500px;
        padding:70px 25px;
    }

    .hero h1{
        font-size:38px;
    }

    .hero p{
        font-size:16px;
    }

    .section{
        padding:30px 15px;
    }

    .row{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
}
</style>
</head>

<body>

<header>

<div class="header-inner">

    <div class="logo">
        🎬 GEO MOVIES
    </div>

    <nav>
        <a href="index.html">მთავარი</a>
        <a href="#movies">ფილმები</a>
        <a href="#new">ახალი</a>
    </nav>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔍 ძებნა..."
    >

    <div class="user-area">

        <span id="userEmail" class="user-email"></span>

        <a
            id="adminButton"
            class="admin-btn"
            href="admin.html"
            style="display:none;"
        >
            👑 Admin
        </a>

        <button
            id="loginButton"
            class="btn login-btn"
        >
            შესვლა
        </button>

        <button
            id="logoutButton"
            class="btn logout-btn"
            style="display:none;"
        >
            გასვლა
        </button>

    </div>

</div>

</header>


<section class="hero">

    <div class="hero-content">

        <div class="badge">
            🎬 GEO MOVIES
        </div>

        <h1>
            შენი საყვარელი ფილმები ერთ სივრცეში
        </h1>

        <p>
            უყურე ფილმებს, სერიალებს და მულტფილმებს
            Geo Movies-ზე.
        </p>

    </div>

</section>


<section
    class="section"
    id="movies"
>

    <h2>
        🔥 ყველა ვიდეო
    </h2>

    <div
        id="moviesList"
        class="row"
    >
        <div class="loading">
            🎬 ვიდეოები იტვირთება...
        </div>
    </div>

</section>


<section
    class="section"
    id="new"
>

    <h2>
        🆕 ახალი დამატებული
    </h2>

    <div
        id="newMovies"
        class="row"
    >
        <div class="loading">
            იტვირთება...
        </div>
    </div>

</section>


<footer>

    <h3>🎬 GEO MOVIES</h3>

    <p style="margin-top:10px;">
        ქართული ვიდეო პლატფორმა
    </p>

    <p style="margin-top:10px;">
        © 2026 Geo Movies
    </p>

</footer>


<!-- LOGIN / REGISTER -->

<div
    id="authBox"
    class="auth-box"
>

    <div class="auth-card">

        <h2 id="authTitle">
            🔐 შესვლა
        </h2>

        <input
            id="authEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="authPassword"
            type="password"
            placeholder="პაროლი"
        >

        <button
            id="authSubmit"
            class="btn login-btn"
        >
            შესვლა
        </button>

        <button
            id="switchAuth"
            class="btn close-auth"
        >
            რეგისტრაცია
        </button>

        <button
            id="closeAuth"
            class="btn close-auth"
        >
            დახურვა
        </button>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://xikxyebvsfpkynhesabm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-CTMHKDnHnuorO8F6NCTgQ_yC27MtQW";

const ADMIN_EMAIL =
"manuchar.fartenadze@gmail.com";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =============================
// ELEMENTS
// =============================

const authBox =
document.getElementById("authBox");

const authTitle =
document.getElementById("authTitle");

const authSubmit =
document.getElementById("authSubmit");

const switchAuth =
document.getElementById("switchAuth");

const authMessage =
document.getElementById("authMessage");

const authEmail =
document.getElementById("authEmail");

const authPassword =
document.getElementById("authPassword");

let registerMode = false;


// =============================
// AUTH WINDOW
// =============================

document
.getElementById("loginButton")
.addEventListener("click",function(){

    registerMode = false;

    updateAuthWindow();

    authBox.style.display="flex";

});


document
.getElementById("closeAuth")
.addEventListener("click",function(){

    authBox.style.display="none";

});


switchAuth.addEventListener("click",function(){

    registerMode = !registerMode;

    updateAuthWindow();

});


function updateAuthWindow(){

    authMessage.textContent="";

    if(registerMode){

        authTitle.textContent =
            "📝 რეგისტრაცია";

        authSubmit.textContent =
            "რეგისტრაცია";

        switchAuth.textContent =
            "უკვე მაქვს ანგარიში";

    }else{

        authTitle.textContent =
            "🔐 შესვლა";

        authSubmit.textContent =
            "შესვლა";

        switchAuth.textContent =
            "რეგისტრაცია";
    }

}


// =============================
// LOGIN / REGISTER
// =============================

authSubmit.addEventListener(
"click",
async function(){

    const email =
        authEmail.value.trim();

    const password =
        authPassword.value;

    if(!email || !password){

        authMessage.textContent =
            "შეავსე Email და პაროლი.";

        return;
    }

    authMessage.style.color="#aaa";

    authMessage.textContent =
        registerMode
        ? "რეგისტრაცია მიმდინარეობს..."
        : "შესვლა მიმდინარეობს...";


    if(registerMode){

        const {data,error} =
            await supabaseClient.auth.signUp({

                email:email,

                password:password

            });


        if(error){

            authMessage.style.color="#ff5555";

            authMessage.textContent =
                "❌ " + error.message;

            return;
        }


        authMessage.style.color="#38d996";

        authMessage.textContent =
            "✅ ანგარიში შეიქმნა. ახლა შესვლა შეგიძლია.";

        registerMode=false;

        updateAuthWindow();

        return;
    }


    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        authMessage.style.color="#ff5555";

        authMessage.textContent =
            "❌ " + error.message;

        return;
    }


    authBox.style.display="none";

    authEmail.value="";
    authPassword.value="";

    updateUserUI(data.user);

});


// =============================
// USER UI
// =============================

function updateUserUI(user){

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const adminButton =
        document.getElementById("adminButton");

    const userEmail =
        document.getElementById("userEmail");


    if(!user){

        loginButton.style.display="block";
        logoutButton.style.display="none";
        adminButton.style.display="none";
        userEmail.textContent="";

        return;
    }


    loginButton.style.display="none";
    logoutButton.style.display="block";

    userEmail.textContent =
        user.email || "";


    if(
        user.email &&
        user.email.toLowerCase()
        ===
        ADMIN_EMAIL.toLowerCase()
    ){

        adminButton.style.display="block";

    }else{

        adminButton.style.display="none";

    }

}


// =============================
// LOGOUT
// =============================

document
.getElementById("logoutButton")
.addEventListener("click",async function(){

    await supabaseClient.auth.signOut();

    updateUserUI(null);

});


// =============================
// LOAD MOVIES
// =============================

let allMovies = [];


async function loadMovies(){

    const moviesList =
        document.getElementById("moviesList");

    const newMovies =
        document.getElementById("newMovies");


    const {data,error} =
        await supabaseClient
        .from("movies")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        console.error(error);

        moviesList.innerHTML =
            `<div class="empty">
                ❌ ვიდეოების ჩატვირთვა ვერ მოხერხდა.
            </div>`;

        newMovies.innerHTML="";

        return;
    }


    allMovies = data || [];

    renderMovies(allMovies);

}


// =============================
// RENDER MOVIES
// =============================

function renderMovies(movies){

    const moviesList =
        document.getElementById("moviesList");

    const newMovies =
        document.getElementById("newMovies");


    if(!movies || movies.length===0){

        moviesList.innerHTML =
            `<div class="empty">
                🎬 ჯერ არცერთი ვიდეო არ დამატებულა.
            </div>`;

        newMovies.innerHTML =
            `<div class="empty">
                ახალი ვიდეოები ჯერ არ არის.
            </div>`;

        return;
    }


    moviesList.innerHTML =
        movies.map(movie => {

            return movieCard(movie);

        }).join("");


    newMovies.innerHTML =
        movies
        .slice(0,6)
        .map(movie => movieCard(movie))
        .join("");

}


function movieCard(movie){

    const poster =
        movie.poster_url ||
        "https://via.placeholder.com/500x750?text=Geo+Movies";

    const title =
        escapeHtml(movie.title || "უსათაურო");

    const genre =
        escapeHtml(movie.genre || "ვიდეო");


    return `
        <a
            class="movie"
            href="movie.html?id=${encodeURIComponent(movie.id)}"
        >

            <img
                src="${escapeHtml(poster)}"
                alt="${title}"
                loading="lazy"
            >

            <div class="movie-info">

                <h3>
                    ${title}
                </h3>

                <span>
                    ${genre}
                </span>

            </div>

        </a>
    `;

}


// =============================
// SEARCH
// =============================

document
.getElementById("search")
.addEventListener("input",function(){

    const value =
        this.value.trim().toLowerCase();

    if(!value){

        renderMovies(allMovies);

        return;
    }


    const filtered =
        allMovies.filter(movie => {

            const title =
                String(movie.title || "")
                .toLowerCase();

            const genre =
                String(movie.genre || "")
                .toLowerCase();

            return (
                title.includes(value) ||
                genre.includes(value)
            );

        });


    renderMovies(filtered);

});


// =============================
// SECURITY
// =============================

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


// =============================
// CHECK SESSION
// =============================

async function checkSession(){

    const {data} =
        await supabaseClient.auth.getSession();

    updateUserUI(
        data.session
        ? data.session.user
        : null
    );

}


// =============================
// START
// =============================

checkSession();

loadMovies();

</script>

</body>
</html>
